name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --doc --workspace --all-features --locked
      - run: cargo test -p unit-compose-allocation-test-harness --locked -- --test-threads=1
      - name: Verify published Rerun recording
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p navigation-planning --features rerun --locked -- \
            --module examples/navigation-planning/astar.yaml \
            --rerun-save /tmp/navigation-astar.rrd
          test -s /tmp/navigation-astar.rrd
          test -s docs/assets/navigation-astar.rrd
          test -s docs/assets/navigation-module.svg
          test -s docs/assets/navigation-module-timed.svg
          grep -Fq \
            'https://app.rerun.io/version/0.24.1/?url=https%3A%2F%2Fraw.githubusercontent.com%2FMiaoDX%2Funit-compose%2Fmain%2Fdocs%2Fassets%2Fnavigation-astar.rrd' \
            README.md
          curl --fail --location --silent --show-error --retry 3 \
            --output /dev/null https://app.rerun.io/version/0.24.1/
          if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]]; then
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/docs/assets/navigation-astar.rrd" \
              --output /tmp/published-navigation-astar.rrd
            cmp docs/assets/navigation-astar.rrd /tmp/published-navigation-astar.rrd
          fi
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - run: RUSTFLAGS="-C panic=abort" cargo check --workspace --lib --bins --all-features --locked
      - name: Cache showcase datasets
        uses: actions/cache@v4
        with:
          path: target/demo-data
          key: showcase-data-v1-742a1baa-7596ffc8
      - name: Build four-demo HTML report
        run: scripts/build-demo-report.sh
      - name: Upload demo report artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ github.sha }}
          path: target/demo-pages
          if-no-files-found: error
          retention-days: 30
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/demo-pages

  linux-arm64-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: aarch64-unknown-linux-gnu
      - name: Install ARM64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross
      - name: Check ARM64 target
        run: cargo check --workspace --all-targets --all-features --target aarch64-unknown-linux-gnu --locked
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  linux-arm64-run:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test -p unit-compose-allocation-test-harness --locked -- --test-threads=1
      - run: cargo run -p navigation-planning --locked -- --module examples/navigation-planning/astar.yaml --strict
      - run: cargo run -p navigation-planning --locked -- --module examples/navigation-planning/dijkstra.yaml --strict
      - run: cargo run -p navigation-planning --locked -- --module examples/navigation-planning/astar-no-smoothing.yaml --strict

  deploy-demo-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - linux-x86_64
      - linux-arm64-compile
      - linux-arm64-run
    runs-on: ubuntu-latest
    concurrency:
      group: demo-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
