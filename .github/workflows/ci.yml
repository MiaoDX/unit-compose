name: CI

on:
  push:
  pull_request:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --doc --workspace --all-features --locked
      - run: cargo test -p unit-compose-allocation-test-harness --locked -- --test-threads=1
      - name: Verify published Rerun recording
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p navigation-planning --features rerun --locked -- \
            --module examples/navigation-planning/astar.yaml \
            --rerun-save /tmp/navigation-astar.rrd
          test -s /tmp/navigation-astar.rrd
          test -s docs/assets/navigation-astar.rrd
          test -s docs/assets/navigation-module.svg
          test -s docs/assets/navigation-module-timed.svg
          grep -Fq \
            'https://app.rerun.io/version/0.24.1/?url=https%3A%2F%2Fraw.githubusercontent.com%2FMiaoDX%2Funit-compose%2Fmain%2Fdocs%2Fassets%2Fnavigation-astar.rrd' \
            README.md
          curl --fail --location --silent --show-error --retry 3 \
            --output /dev/null https://app.rerun.io/version/0.24.1/
          if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]]; then
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/docs/assets/navigation-astar.rrd" \
              --output /tmp/published-navigation-astar.rrd
            cmp docs/assets/navigation-astar.rrd /tmp/published-navigation-astar.rrd
          fi
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - run: RUSTFLAGS="-C panic=abort" cargo check --workspace --lib --bins --all-features --locked

  linux-arm64-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
          targets: aarch64-unknown-linux-gnu
      - run: cargo check --workspace --all-targets --all-features --target aarch64-unknown-linux-gnu --locked

  linux-arm64-run:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test -p unit-compose-allocation-test-harness --locked -- --test-threads=1
      - run: cargo run -p navigation-planning --locked -- --module examples/navigation-planning/astar.yaml --strict
      - run: cargo run -p navigation-planning --locked -- --module examples/navigation-planning/dijkstra.yaml --strict
      - run: cargo run -p navigation-planning --locked -- --module examples/navigation-planning/astar-no-smoothing.yaml --strict
