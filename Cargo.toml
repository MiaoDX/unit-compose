[workspace]
members = [
    "crates/unit-compose-core",
    "crates/unit-compose-core/allocation-test-harness",
    "crates/unit-compose-debug",
    "crates/unit-compose-yaml",
    "examples/navigation-planning",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.1"
license = "MIT"
repository = "https://github.com/unit-compose/unit-compose"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
