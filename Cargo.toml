[workspace]
members = ["crates/unit-compose-core"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.1"
license = "MIT"
repository = "https://github.com/unit-compose/unit-compose"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
