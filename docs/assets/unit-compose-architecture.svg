<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">UnitCompose V0 architecture</title>
  <desc id="desc">A host application combines a compiled Unit Registry with a YAML Module Definition to build a Module containing Units and Resources. The Module executes a validated static DAG and exposes a read-only Debug interface.</desc>
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .panel { fill: #121933; stroke: #42558f; stroke-width: 2; }
      .card { fill: #172142; stroke: #6683d7; stroke-width: 2; }
      .resource { fill: #23345f; stroke: #8ca8ff; stroke-width: 1.5; }
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #eef3ff; }
      .subtitle { font: 700 19px Arial, Helvetica, sans-serif; fill: #d5e0ff; }
      .text { font: 500 16px Arial, Helvetica, sans-serif; fill: #e1e8ff; }
      .small { font: 500 14px Arial, Helvetica, sans-serif; fill: #c4d1f7; }
      .tiny { font: 500 13px Arial, Helvetica, sans-serif; fill: #b8c6ee; }
      .line { stroke: #9ab3ff; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7f95d8; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ab3ff"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="720" rx="24"/>
  <text class="title" x="42" y="54">UnitCompose V0</text>
  <text class="subtitle" x="42" y="84">Configuration-driven Units connected by typed Resources inside an existing host</text>

  <rect class="panel" x="42" y="122" width="250" height="220" rx="18"/>
  <text class="subtitle" x="67" y="158">Host application</text>
  <text class="text" x="67" y="194">ROS node / service</text>
  <text class="text" x="67" y="222">simulator / offline tool</text>
  <text class="small" x="67" y="260">• owns the Module</text>
  <text class="small" x="67" y="284">• supplies inputs</text>
  <text class="small" x="67" y="308">• consumes outputs</text>
  <text class="small" x="67" y="332">• swaps configuration between runs</text>

  <rect class="card" x="342" y="122" width="340" height="116" rx="16"/>
  <text class="subtitle" x="367" y="158">YAML Module Definition</text>
  <text class="small" x="367" y="190">Unit types, config, Resource bindings, inputs, outputs</text>
  <text class="tiny" x="367" y="216">The graph changes without changing host source code.</text>

  <rect class="card" x="722" y="122" width="436" height="116" rx="16"/>
  <text class="subtitle" x="747" y="158">Compiled Unit Registry</text>
  <text class="small" x="747" y="190">Stable type names, typed ports, config decoders, factories</text>
  <text class="tiny" x="747" y="216">The binary defines which implementations are available.</text>

  <rect class="panel" x="342" y="280" width="816" height="366" rx="22"/>
  <text class="subtitle" x="370" y="317">Module — validated static Resource DAG</text>

  <rect class="card" x="380" y="362" width="150" height="78" rx="14"/>
  <text class="text" x="421" y="395">Unit A</text>
  <text class="tiny" x="401" y="420">typed inputs / outputs</text>

  <rect class="resource" x="572" y="371" width="140" height="60" rx="30"/>
  <text class="text" x="602" y="407">Resource X</text>

  <rect class="card" x="756" y="338" width="150" height="78" rx="14"/>
  <text class="text" x="797" y="371">Unit B</text>
  <text class="tiny" x="777" y="396">read-only consumer</text>

  <rect class="card" x="756" y="448" width="150" height="78" rx="14"/>
  <text class="text" x="797" y="481">Unit C</text>
  <text class="tiny" x="777" y="506">read-only consumer</text>

  <rect class="resource" x="952" y="393" width="160" height="60" rx="30"/>
  <text class="text" x="984" y="429">Resource Y</text>

  <path class="line" d="M 530 401 L 572 401"/>
  <path class="line" d="M 712 401 C 730 401, 735 377, 756 377"/>
  <path class="line" d="M 712 401 C 730 401, 735 487, 756 487"/>
  <path class="line" d="M 906 377 C 930 377, 928 423, 952 423"/>
  <path class="line" d="M 906 487 C 930 487, 928 423, 952 423"/>

  <text class="small" x="380" y="566">Build validates Unit types, config, port bindings, Resource types, producers, outputs, and cycles.</text>
  <text class="small" x="380" y="592">V0 executes Units once in a stable sequential topological order and stops on the first Unit error.</text>
  <text class="small" x="380" y="618">No transaction, rollback, automatic parallelism, or in-place graph mutation is required for V0.</text>

  <rect class="panel" x="42" y="382" width="250" height="264" rx="18"/>
  <text class="subtitle" x="67" y="418">Debug</text>
  <text class="small" x="67" y="452">Read-only Module inspection:</text>
  <text class="small" x="82" y="482">• Units and Resources</text>
  <text class="small" x="82" y="508">• producers and consumers</text>
  <text class="small" x="82" y="534">• DOT / Mermaid graph</text>
  <text class="small" x="82" y="560">• execution order and timing</text>
  <text class="small" x="82" y="586">• structured errors</text>
  <text class="small" x="82" y="612">• optional Rerun rendering</text>

  <path class="line" d="M 292 226 C 320 226, 320 424, 342 424"/>
  <path class="line" d="M 512 238 L 512 280"/>
  <path class="line" d="M 940 238 L 940 280"/>
  <path class="dash" d="M 342 514 C 320 514, 320 514, 292 514"/>
</svg>
