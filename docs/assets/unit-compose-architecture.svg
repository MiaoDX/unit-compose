<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">UnitCompose architecture overview</title>
  <desc id="desc">Architecture diagram showing a host application embedding a Module, a Plan defining Units and Resources, the Scheduler executing Units, the ResourceStore managing state, and external integrations including Rust, Python, and optional host exports.</desc>
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .panel { fill: #121933; stroke: #3b4a7a; stroke-width: 2; }
      .card { fill: #172142; stroke: #5f75ba; stroke-width: 2; }
      .soft { fill: #1d2a52; stroke: #6e87d6; stroke-width: 1.5; }
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #eef3ff; }
      .subtitle { font: 600 18px Arial, Helvetica, sans-serif; fill: #cdd9ff; }
      .text { font: 500 16px Arial, Helvetica, sans-serif; fill: #dee7ff; }
      .small { font: 500 14px Arial, Helvetica, sans-serif; fill: #c6d2fb; }
      .tiny { font: 500 13px Arial, Helvetica, sans-serif; fill: #b8c5ef; }
      .line { stroke: #93adff; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7d92d6; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93adff" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760" rx="24"/>

  <text class="title" x="40" y="52">UnitCompose Architecture Overview</text>
  <text class="subtitle" x="40" y="82">An embeddable framework for organizing stateful computation into Modules, Units, Resources, and validated Plans</text>

  <rect class="panel" x="40" y="120" width="250" height="180" rx="18"/>
  <text class="subtitle" x="65" y="155">Host application</text>
  <text class="text" x="65" y="190">ROS node / service / simulator</text>
  <text class="text" x="65" y="220">Creates and owns a Module</text>
  <text class="text" x="65" y="250">Triggers one Run per request</text>
  <text class="text" x="65" y="280">Consumes committed exports</text>

  <rect class="panel" x="330" y="120" width="830" height="560" rx="22"/>
  <text class="subtitle" x="360" y="155">Embedded UnitCompose module</text>
  <text class="small" x="360" y="182">The host embeds one or more Modules. Each Module owns Unit instances, Resource state, and lifecycle status.</text>

  <rect class="card" x="360" y="210" width="360" height="170" rx="16"/>
  <text class="subtitle" x="385" y="242">Plan</text>
  <text class="text" x="385" y="275">Validated semantic composition</text>
  <text class="small" x="385" y="302">• Units and normalized config</text>
  <text class="small" x="385" y="326">• Resources, lifetimes, and exports</text>
  <text class="small" x="385" y="350">• Access intents and predecessor bindings</text>

  <rect class="card" x="750" y="210" width="380" height="170" rx="16"/>
  <text class="subtitle" x="775" y="242">Scheduler</text>
  <text class="text" x="775" y="275">Executes ready Units</text>
  <text class="small" x="775" y="302">• Sequential reference execution in Alpha</text>
  <text class="small" x="775" y="326">• Future parallel scheduling preserves Plan semantics</text>
  <text class="small" x="775" y="350">• No hidden dependency injection</text>

  <rect class="card" x="360" y="410" width="420" height="225" rx="16"/>
  <text class="subtitle" x="385" y="442">Units</text>
  <rect class="soft" x="390" y="470" width="110" height="60" rx="12"/>
  <text class="text" x="420" y="505">Unit A</text>
  <text class="tiny" x="408" y="525">Observe / Create</text>
  <rect class="soft" x="520" y="470" width="110" height="60" rx="12"/>
  <text class="text" x="550" y="505">Unit B</text>
  <text class="tiny" x="538" y="525">Observe / Update</text>
  <rect class="soft" x="650" y="470" width="110" height="60" rx="12"/>
  <text class="text" x="680" y="505">Unit C</text>
  <text class="tiny" x="674" y="525">Create / Export</text>
  <text class="small" x="390" y="570">Each Unit is the smallest scheduled computation.</text>
  <text class="small" x="390" y="594">A Unit can hold private state, but Alpha treats execution failure</text>
  <text class="small" x="390" y="616">as a poisoned-Module boundary rather than promising rollback.</text>

  <rect class="card" x="810" y="410" width="320" height="225" rx="16"/>
  <text class="subtitle" x="835" y="442">Resources / ResourceStore</text>
  <text class="text" x="835" y="474">Logical Resource model</text>
  <text class="small" x="835" y="502">• host inputs</text>
  <text class="small" x="835" y="524">• intermediate values</text>
  <text class="small" x="835" y="546">• persistent state</text>
  <text class="small" x="835" y="568">• committed exports</text>
  <text class="small" x="835" y="598">Internal machinery may track publications, commits, leases,</text>
  <text class="small" x="835" y="620">and storage reuse, but these are not primary user concepts.</text>

  <path class="line" d="M 290 210 C 320 210, 325 210, 355 210"/>
  <path class="line" d="M 540 380 C 540 395, 540 395, 540 410"/>
  <path class="line" d="M 940 380 C 940 395, 940 395, 940 410"/>
  <path class="line" d="M 720 295 C 735 295, 735 295, 750 295"/>
  <path class="dash" d="M 780 520 C 800 520, 800 520, 810 520"/>
  <path class="dash" d="M 810 560 C 780 560, 780 560, 760 560"/>

  <rect class="panel" x="40" y="340" width="250" height="150" rx="18"/>
  <text class="subtitle" x="65" y="375">Run outcome</text>
  <text class="text" x="65" y="408">Success:</text>
  <text class="small" x="85" y="432">commit persistent successors</text>
  <text class="small" x="85" y="454">and expose exports atomically</text>
  <text class="text" x="65" y="478">Failure:</text>
  <text class="small" x="85" y="502">no commit; Module becomes poisoned</text>

  <rect class="panel" x="40" y="520" width="250" height="160" rx="18"/>
  <text class="subtitle" x="65" y="555">Language &amp; ecosystem</text>
  <text class="small" x="65" y="585">• Rust-first implementation</text>
  <text class="small" x="65" y="607">• Python authoring and interop</text>
  <text class="small" x="65" y="629">• Conditional zero-copy exports</text>
  <text class="small" x="65" y="651">• Inspirations: Holoscan, Bevy, Flecs,</text>
  <text class="small" x="80" y="673">Salsa, Timely, Temporal</text>

  <path class="line" d="M 290 410 C 320 410, 335 470, 360 470"/>
  <path class="line" d="M 290 590 C 320 590, 325 590, 355 590"/>
</svg>
