<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">UnitCompose architecture overview</title>
  <desc id="desc">A host builds a prepared UnitCompose Module from registered Unit implementations and a YAML definition. The Module contains Units connected by logical Resources, framework-managed storage and workspaces, and read-only inspection capabilities.</desc>
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .panel { fill: #121933; stroke: #3b4a7a; stroke-width: 2; }
      .card { fill: #172142; stroke: #5f75ba; stroke-width: 2; }
      .soft { fill: #1d2a52; stroke: #6e87d6; stroke-width: 1.5; }
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #eef3ff; }
      .subtitle { font: 600 18px Arial, Helvetica, sans-serif; fill: #cdd9ff; }
      .text { font: 500 15px Arial, Helvetica, sans-serif; fill: #dee7ff; }
      .small { font: 500 13px Arial, Helvetica, sans-serif; fill: #c6d2fb; }
      .line { stroke: #93adff; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7d92d6; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93adff"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760" rx="24"/>
  <text class="title" x="40" y="52">UnitCompose Architecture Overview</text>
  <text class="subtitle" x="40" y="82">Configuration-driven Resource DAG with prepared output storage and Unit workspace</text>

  <rect class="panel" x="40" y="120" width="255" height="205" rx="18"/>
  <text class="subtitle" x="65" y="155">Host application</text>
  <text class="text" x="65" y="188">ROS node / service / simulator</text>
  <text class="text" x="65" y="218">Registers Unit implementations</text>
  <text class="text" x="65" y="248">Loads YAML and build options</text>
  <text class="text" x="65" y="278">Owns, runs, and swaps Module</text>
  <text class="small" x="65" y="306">Lifecycle and communication remain host-owned</text>

  <rect class="panel" x="335" y="120" width="825" height="590" rx="22"/>
  <text class="subtitle" x="365" y="155">Prepared UnitCompose Module</text>
  <text class="small" x="365" y="182">Immutable graph, stable execution order, prepared storage, and read-only inspection</text>

  <rect class="card" x="365" y="210" width="360" height="145" rx="16"/>
  <text class="subtitle" x="390" y="242">Build and prepare</text>
  <text class="text" x="390" y="274">Validate types, bindings, bounds, cycles</text>
  <text class="small" x="390" y="302">Compile stable order and Resource live ranges</text>
  <text class="small" x="390" y="326">Plan slots, allocate workspace, warm up Units</text>

  <rect class="card" x="755" y="210" width="375" height="145" rx="16"/>
  <text class="subtitle" x="780" y="242">Inspection</text>
  <text class="text" x="780" y="274">Graph, diagnostics, timing, failures</text>
  <text class="small" x="780" y="302">Requirements, slot assignments, peak memory</text>
  <text class="small" x="780" y="326">Optional Resource renderers and adapters</text>

  <rect class="card" x="365" y="390" width="475" height="260" rx="16"/>
  <text class="subtitle" x="390" y="422">Units and logical Resources</text>
  <rect class="soft" x="395" y="455" width="110" height="58" rx="12"/>
  <text class="text" x="424" y="489">Unit A</text>
  <rect class="soft" x="548" y="455" width="110" height="58" rx="12"/>
  <text class="text" x="577" y="489">Unit B</text>
  <rect class="soft" x="701" y="455" width="110" height="58" rx="12"/>
  <text class="text" x="730" y="489">Unit C</text>
  <path class="line" d="M 505 484 L 548 484"/>
  <path class="line" d="M 658 484 L 701 484"/>
  <text class="small" x="405" y="544">Each Resource has one producer and read-only consumers.</text>
  <text class="small" x="405" y="570">Unit run reads inputs, writes provided outputs, and uses</text>
  <text class="small" x="405" y="592">bounded scratch instead of allocating output payloads.</text>
  <text class="small" x="405" y="620">First error stops later launches; partial outputs stay hidden.</text>

  <rect class="card" x="870" y="390" width="260" height="260" rx="16"/>
  <text class="subtitle" x="895" y="422">Prepared memory</text>
  <text class="text" x="895" y="456">Typed Resource slots</text>
  <text class="small" x="895" y="482">• fixed values and buffers</text>
  <text class="small" x="895" y="504">• bounded variable outputs</text>
  <text class="small" x="895" y="526">• conservative slot reuse</text>
  <text class="text" x="895" y="562">Unit workspace</text>
  <text class="small" x="895" y="588">• size and alignment declared</text>
  <text class="small" x="895" y="610">• caller-provided scratch stack</text>
  <text class="small" x="895" y="632">• strict no-run-allocation option</text>

  <path class="line" d="M 295 220 C 320 220, 330 220, 360 220"/>
  <path class="line" d="M 545 355 L 545 390"/>
  <path class="dash" d="M 840 520 L 870 520"/>
  <path class="dash" d="M 1000 390 L 1000 355"/>

  <rect class="panel" x="40" y="365" width="255" height="160" rx="18"/>
  <text class="subtitle" x="65" y="400">Execution policies</text>
  <text class="text" x="65" y="434">Development:</text>
  <text class="small" x="85" y="458">grow and measure observed peaks</text>
  <text class="text" x="65" y="488">Production / strict:</text>
  <text class="small" x="85" y="512">reject overflow; verify zero allocator calls</text>

  <rect class="panel" x="40" y="565" width="255" height="145" rx="18"/>
  <text class="subtitle" x="65" y="600">Deferred</text>
  <text class="small" x="65" y="630">Parallel and async execution</text>
  <text class="small" x="65" y="652">Persistent Resources and transactions</text>
  <text class="small" x="65" y="674">Plugins, Python, GPU and external leases</text>
</svg>
